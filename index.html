      </div>
    `;
    const container = root.querySelector("#gal-container");
    const input = root.querySelector("#gal-upload");
    const countEl = root.querySelector("#gal-count");

    function render() {
      countEl.textContent = `${State.gallery.length} imagem(ns)`;
      container.innerHTML = "";
      if (State.gallery.length === 0) {
        container.innerHTML = '<div class="gal-empty">Nenhuma imagem adicionada.<br>Use "Adicionar imagem" para incluir.</div>';
        return;
      }
      const grid = el("div", { class: "gal-grid" });
      State.gallery.forEach((img, i) => {
        const thumb = el("div", { class: "gal-thumb" });
        thumb.appendChild(el("img", { src: img.data, alt: img.name }));
        const del = el("button", { class: "gal-del", title: "Remover" }, "×");
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          State.gallery = State.gallery.filter(g => g.id !== img.id);
          Storage.set("gallery", State.gallery);
          render();
        });
        thumb.appendChild(del);
        thumb.addEventListener("click", () => openViewer(i));
        grid.appendChild(thumb);
      });
      container.appendChild(grid);
    }

    function openViewer(index) {
      let cur = index, zoom = 1, slideshowOn = false, slideshowTimer = null;
      const viewer = el("div", { class: "gal-viewer" });
      const imgEl = el("img");
      const close = el("button", { class: "gv-close", title: "Fechar" }, "×");
      const prev = el("button", { class: "gv-nav gv-prev" }, "‹");
      const next = el("button", { class: "gv-nav gv-next" }, "›");
      const nameEl = el("div", { class: "gv-name" });
      const slideBtn = el("button", { class: "gv-slideshow" }, "▶ Slideshow");

      function update() {
        const g = State.gallery[cur];
        if (!g) { viewer.remove(); return; }
        imgEl.src = g.data; nameEl.textContent = g.name;
        zoom = 1; imgEl.style.transform = "scale(1)";
      }
      function startSlideshow() {
        slideshowOn = true; slideBtn.classList.add("active"); slideBtn.textContent = "⏸ Slideshow";
        slideshowTimer = setInterval(() => { cur = (cur + 1) % State.gallery.length; update(); }, 3000);
      }
      function stopSlideshow() {
        slideshowOn = false; slideBtn.classList.remove("active"); slideBtn.textContent = "▶ Slideshow";
        clearInterval(slideshowTimer);
      }
      prev.addEventListener("click", () => { cur = (cur - 1 + State.gallery.length) % State.gallery.length; update(); });
      next.addEventListener("click", () => { cur = (cur + 1) % State.gallery.length; update(); });
      close.addEventListener("click", () => { stopSlideshow(); viewer.remove(); });
      slideBtn.addEventListener("click", () => { slideshowOn ? stopSlideshow() : startSlideshow(); });
      imgEl.addEventListener("wheel", (e) => {
        e.preventDefault();
        zoom = clamp(zoom - e.deltaY * 0.001, 0.4, 5);
        imgEl.style.transform = `scale(${zoom})`;
      }, { passive: false });

      viewer.appendChild(imgEl);
      viewer.appendChild(close);
      viewer.appendChild(prev);
      viewer.appendChild(next);
      viewer.appendChild(nameEl);
      viewer.appendChild(slideBtn);
      container.appendChild(viewer);
      update();
    }

    root.querySelector('[data-act="upload"]').addEventListener("click", () => input.click());
    input.addEventListener("change", () => {
      Array.from(input.files).forEach(file => {
        if (!file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = (e) => { State.gallery.push({ id: uid(), name: file.name, data: e.target.result }); Storage.set("gallery", State.gallery); render(); };
        reader.readAsDataURL(file);
      });
      input.value = "";
    });
    render();
  }
});

registerApp({
  id: "terminal", name: "Terminal", icon: "terminal", pinned: true,
  mount(root) {
    root.innerHTML = `<div class="term-body" id="term-out"></div>`;
    const out = root.querySelector("#term-out");
    function line(html, cls) {
      const div = el("div", { class: "term-line" + (cls ? " " + cls : ""), html });
      out.appendChild(div); out.scrollTop = out.scrollHeight;
    }
    function resolvePath(p) {
      // aceita caminho relativo ao root
      const parts = p.split("/").filter(Boolean);
      let node = State.fs;
      for (const part of parts) {
        if (!node.children) return null;
        node = node.children.find(c => c.name === part);
        if (!node) return null;
      }
      return node;
    }
    function promptLine() {
      const wrap = el("div", { class: "term-input-line" });
      wrap.appendChild(el("div", { class: "prompt", html: `usuário@webos:<span class="path">Início</span>$` }));
      const input = el("input", { class: "term-input", autocomplete: "off", spellcheck: "false" });
      wrap.appendChild(input);
      out.appendChild(wrap); out.scrollTop = out.scrollHeight;
      input.focus();
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const val = input.value;
          wrap.querySelector(".term-input")?.remove();
          wrap.innerHTML = `usuário@webos:Início$ ${val}`;
          run(val);
        }
      });
      out.addEventListener("click", () => input.focus());
    }
    function run(cmdline) {
      const parts = cmdline.trim().split(/\s+/);
      const cmd = parts[0] ? parts[0].toLowerCase() : "";
      const args = parts.slice(1);
      if (cmd === "") { promptLine(); return; }
      switch(cmd) {
        case "help":
          line("Comandos: help, clear, date, time, about, apps, neofetch, ls, cat <f>, echo, whoami, settings, ver"); break;
        case "clear": out.innerHTML = ""; break;
        case "date": line(new Date().toLocaleDateString("pt-BR")); break;
        case "time": line(new Date().toLocaleTimeString("pt-BR")); break;
        case "ver": line("WebOS " + VERSION); break;
        case "about":
          line("WebOS — Sistema Operacional Virtual");
          line("Versão " + VERSION); break;
        case "apps": Object.values(Apps).forEach(a => line("  • " + a.name + "  (" + a.id + ")")); break;
        case "neofetch":
          line(`<div class="term-neofetch"><pre>
     ████████╗
   ██╔══════╗██
  ██║  ████  ║██
  ██║  ████  ║██
  ██║  ████  ║██
   ██╚══════╝██
     ████████╗
</pre><div>WebOS ${VERSION}<br>Usuário: ${State.settings.username}<br>Tema: ${State.settings.theme}<br>Shell: webos-sh<br>Apps abertos: ${State.windows.size}<br>Hora: ${fmtTime(new Date())}</div></div>`); break;
        case "ls":
          State.fs.children.forEach(c => line((c.type === "folder" ? "📁 " : "📄 ") + c.name)); break;
        case "cat": {
          if (!args[0]) { line("Uso: cat <caminho>", "err"); break; }
          const node = resolvePath(args[0]);
          if (!node || node.type !== "file") { line("Arquivo não encontrado.", "err"); break; }
          (node.content || "").split("\n").forEach(l => line(l)); break;
        }
        case "echo": line(args.join(" ")); break;
        case "whoami": line(State.settings.username); break;
        case "settings": openApp("settings"); break;
        default: line(`Comando não encontrado: ${cmd}`, "err");
      }
      promptLine();
    }
    line(`WebOS Terminal — v${VERSION}`);
    line("Digite 'help' para ver os comandos.");
    promptLine();
  }
});

registerApp({
  id: "browser", name: "Navegador", icon: "browser", pinned: true,
  mount(root) {
    root.innerHTML = `
      <div style="height:100%;display:flex;flex-direction:column;">
        <div class="br-tabs" id="br-tabs"></div>
        <div class="br-bar">
          <button class="br-nav-btn" id="br-back" disabled aria-label="Voltar">‹</button>
          <button class="br-nav-btn" id="br-fwd" disabled aria-label="Avançar">›</button>
          <button class="br-nav-btn" id="br-refresh" aria-label="Recarregar">⟳</button>
          <input class="br-address" id="br-address" placeholder="Pesquisar ou digitar URL">
          <button class="br-nav-btn" id="br-go" aria-label="Ir">↵</button>
        </div>
        <div class="br-view" id="br-view"></div>
      </div>
    `;
    const tabsEl = root.querySelector("#br-tabs");
    const view = root.querySelector("#br-view");
    const address = root.querySelector("#br-address");
    const backBtn = root.querySelector("#br-back");
    const fwdBtn = root.querySelector("#br-fwd");
    const tabs = []; let activeTab = null;

    function newTab(url) {
      const tab = { id: uid(), title: "Nova aba", history: [], historyIdx: -1 };
      tabs.push(tab); activeTab = tab; renderTabs();
      if (url) navigate(url); else showHome();
    }
    function renderTabs() {
      tabsEl.innerHTML = "";
      tabs.forEach(t => {
        const tabEl = el("div", { class: "br-tab" + (t === activeTab ? " active" : "") }, [el("span", {}, t.title), el("button", { class: "br-tab-close" }, "×")]);
        tabEl.querySelector(".br-tab-close").addEventListener("click", (e) => {
          e.stopPropagation();
          const idx = tabs.indexOf(t); tabs.splice(idx, 1);
          if (activeTab === t) { activeTab = tabs[Math.max(0, idx-1)] || null; if (activeTab) showTab(); else showHome(); }
          renderTabs();
        });
        tabEl.addEventListener("click", () => { activeTab = t; renderTabs(); showTab(); });
        tabsEl.appendChild(tabEl);
      });
      const newBtn = el("button", { class: "br-newtab-btn", title: "Nova aba" }, "+");
      newBtn.addEventListener("click", () => newTab());
      tabsEl.appendChild(newBtn);
      if (activeTab) {
        backBtn.disabled = activeTab.historyIdx <= 0;
        fwdBtn.disabled = activeTab.historyIdx >= activeTab.history.length - 1;
      }
    }
    function showTab() {
      if (!activeTab) return;
      const url = activeTab.history[activeTab.historyIdx];
      if (!url) return showHome();
      address.value = url;
      view.innerHTML = "";
      const iframe = el("iframe", { src: url, sandbox: "allow-scripts allow-same-origin allow-forms allow-popups" });
      let loaded = false;
      iframe.addEventListener("load", () => { loaded = true; });
      view.appendChild(iframe);
      setTimeout(() => {
        if (!loaded) {
          // provavelmente bloqueado
          view.innerHTML = `
            <div class="br-blocked">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <p><strong>Não foi possível carregar a página.</strong><br>Este site bloqueia ser exibido em iframes (CORS/X-Frame-Options). A navegação por iframe é limitada pelo navegador.</p>
              <p style="font-size:12px;">URL: ${url}</p>
            </div>
          `;
        }
      }, 2800);
    }
    function showHome() {
      view.innerHTML = `
        <div class="br-home">
          <h1>WebOS</h1>
          <input class="br-home-search" id="br-home-search" placeholder="Pesquisar na web...">
          <div class="br-shortcuts">
            <div class="br-shortcut" data-url="https://www.google.com"><div class="sc-icon" style="background:#4285f4">G</div><span>Google</span></div>
            <div class="br-shortcut" data-url="https://www.youtube.com"><div class="sc-icon" style="background:#ff0000">▶</div><span>YouTube</span></div>
            <div class="br-shortcut" data-url="https://www.wikipedia.org"><div class="sc-icon" style="background:#000">W</div><span>Wikipedia</span></div>
            <div class="br-shortcut" data-url="https://github.com"><div class="sc-icon" style="background:#24292e">⌘</div><span>GitHub</span></div>
            <div class="br-shortcut" data-url="https://developer.mozilla.org"><div class="sc-icon" style="background:#000">M</div><span>MDN</span></div>
            <div class="br-shortcut" data-url="https://stackoverflow.com"><div class="sc-icon" style="background:#f48024">S</div><span>StackOverflow</span></div>
          </div>
        </div>
      `;
      view.querySelector("#br-home-search").addEventListener("keydown", (e) => {
        if (e.key === "Enter") { const q = e.target.value.trim(); if (q) navigate("https://www.google.com/search?q=" + encodeURIComponent(q)); }
      });
      view.querySelectorAll(".br-shortcut").forEach(sc => sc.addEventListener("click", () => navigate(sc.dataset.url)));
      address.value = "";
    }
    function navigate(input) {
      if (!activeTab) newTab();
      let url = input.trim(); if (!url) return;
      if (!/^https?:\/\//i.test(url)) {
        if (/^[\w-]+(\.[\w-]+)+/.test(url)) url = "https://" + url;
        else url = "https://www.google.com/search?q=" + encodeURIComponent(url);
      }
      activeTab.history = activeTab.history.slice(0, activeTab.historyIdx + 1);
      activeTab.history.push(url); activeTab.historyIdx = activeTab.history.length - 1;
      activeTab.title = url.replace(/^https?:\/\//, "").split("/")[0];
      renderTabs(); showTab();
    }
    root.querySelector("#br-go").addEventListener("click", () => navigate(address.value));
    address.addEventListener("keydown", (e) => { if (e.key === "Enter") navigate(address.value); });
    backBtn.addEventListener("click", () => { if (activeTab && activeTab.historyIdx > 0) { activeTab.historyIdx--; showTab(); renderTabs(); } });
    fwdBtn.addEventListener("click", () => { if (activeTab && activeTab.historyIdx < activeTab.history.length - 1) { activeTab.historyIdx++; showTab(); renderTabs(); } });
    root.querySelector("#br-refresh").addEventListener("click", () => {
      if (!activeTab) return;
      const url = activeTab.history[activeTab.historyIdx];
      if (url) showTab(); else showHome();
    });
    newTab();
  }
});

function openApp(appId) {
  const app = Apps[appId];
  if (!app) return;
  const existing = WindowManager.getWindows().find(w => w.appId === appId);
  if (existing) { WindowManager.focus(existing.id); return; }
  WindowManager.create({
    appId, title: app.name, icon: app.icon,
    width: 720, height: 480,
    onMount: (body, win) => {
      const cleanup = app.mount(body, win);
      if (typeof cleanup === "function") win.onClose = cleanup;
    }
  });
}

const DESKTOP_APPS = ["files", "browser", "notepad", "calculator", "gallery", "terminal", "taskmanager", "settings"];

const Desktop = {
  init() {
    const container = $("#desktop-icons");
    container.innerHTML = "";

    if (!positions) {
      positions = {};
      DESKTOP_APPS.forEach((id, i) => { positions[id] = { x: 20, y: 20 + i * 96 }; });
      State.desktopIcons = positions;
      Storage.set("desktopIcons", positions);
    }
    DESKTOP_APPS.forEach(appId => {
      const app = Apps[appId];
      const pos = positions[appId] || { x: 20, y: 20 };
      const icon = el("div", { class: "desk-icon", style: { left: pos.x + "px", top: pos.y + "px" }, "data-app": appId }, [
        el("div", { html: Icons[app.icon] }),
        el("span", {}, app.name)
      ]);
      icon.querySelector("svg").style.width = "44px";
      icon.querySelector("svg").style.height = "44px";
      this._makeDraggable(icon, appId);
      icon.addEventListener("dblclick", () => openApp(appId));
      icon.addEventListener("click", (e) => { e.stopPropagation(); $$(".desk-icon").forEach(n => n.classList.remove("selected")); icon.classList.add("selected"); });
      icon.addEventListener("contextmenu", (e) => {
        e.preventDefault(); e.stopPropagation();
        showContextMenu(e.clientX, e.clientY, [
          { label: "Abrir", icon: "folder", action: () => openApp(appId) },
          { sep: true },
          { label: "Organizar ícones", icon: "settings", action: () => this.arrangeIcons() }
        ]);
      });
      container.appendChild(icon);
    });
    // Trash icon
    const trashIcon = el("div", { class: "desk-icon", style: { left: "20px", top: (20 + DESKTOP_APPS.length * 96) + "px" }, "data-trash": "1" }, [
      el("div", { html: Icons.trash }),
      el("span", {}, "Lixeira")
    ]);
    trashIcon.querySelector("svg").style.width = "44px";
    trashIcon.querySelector("svg").style.height = "44px";
    trashIcon.addEventListener("dblclick", () => {
      WindowManager.create({
        appId: "trash-desktop", title: "Lixeira", icon: "trash", width: 560, height: 420, noPersist: true,
        onMount(body) {
          body.innerHTML = `<div class="app-toolbar"><button class="app-btn" id="dt-empty">Esvaziar</button></div><div class="fm-items" id="dt-items" style="padding:10px;"></div>`;
          function render() {
            const cont = body.querySelector("#dt-items");
            cont.innerHTML = "";
            if (!State.trash.length) { cont.innerHTML = '<div class="fm-empty" style="grid-column:1/-1;">Lixeira vazia</div>'; return; }
            State.trash.forEach(it => {
              const node = el("div", { class: "fm-item" }, [el("div", { html: Icons.file }), el("span", {}, it.node.name)]);
              node.querySelector("svg").style.width = "36px";
              node.querySelector("svg").style.height = "36px";
              cont.appendChild(node);
            });
          }
          body.querySelector("#dt-empty").addEventListener("click", () => {
            if (!confirm("Esvaziar?")) return;
            State.trash = []; Storage.set("trash", State.trash); render();
            Notifications.push("Lixeira", "Lixeira esvaziada.", "trash");
          });
          render();
        }
      });
    });
    container.appendChild(trashIcon);

    // Context menu desktop
    $("#desktop").addEventListener("contextmenu", (e) => {
      if (e.target.closest(".desk-icon") || e.target.closest(".window")) return;
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label: "Novo arquivo", icon: "file", action: () => { const name = prompt("Nome:", "novo.txt"); if (!name) return; findNode("docs").node.children.push({ id: uid(), name, type: "file", content: "" }); saveFS(); Notifications.push("Arquivos", "Arquivo criado.", "files"); }},
        { label: "Nova pasta", icon: "folder", action: () => { const name = prompt("Nome:", "Nova Pasta"); if (!name) return; findNode("docs").node.children.push({ id: uid(), name, type: "folder", children: [] }); saveFS(); Notifications.push("Arquivos", "Pasta criada.", "files"); }},
        { sep: true },
        { label: "Organizar ícones", icon: "settings", action: () => this.arrangeIcons() },
        { label: "Configurações", icon: "settings", action: () => openApp("settings") }
      ]);
    });
    $("#desktop").addEventListener("click", (e) => {
      if (e.target.id === "desktop" || e.target.id === "desktop-icons") $$(".desk-icon").forEach(n => n.classList.remove("selected"));
    });
    // Duplo clique no wallpaper abre Arquivos
    $("#desktop").addEventListener("dblclick", (e) => {
      if (e.target.id === "desktop" || e.target.id === "desktop-icons") openApp("files");
    });
  },
  _makeDraggable(icon, appId) {
    let startX, startY, startL, startT, dragging = false;
    icon.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      dragging = true; startX = e.clientX; startY = e.clientY;
      startL = icon.offsetLeft; startT = icon.offsetTop;
      e.preventDefault();
      const onMove = (ev) => {
        if (!dragging) return;
        let nx = clamp(startL + (ev.clientX - startX), 0, window.innerWidth - 90);
        let ny = clamp(startT + (ev.clientY - startY), 0, window.innerHeight - 150);
        icon.style.left = nx + "px"; icon.style.top = ny + "px";
      };
      const onUp = () => {
        dragging = false;
        document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp);
        const pos = State.desktopIcons || {};
        pos[appId] = { x: icon.offsetLeft, y: icon.offsetTop };
        State.desktopIcons = pos; Storage.set("desktopIcons", pos);
      };
      document.addEventListener("mousemove", onMove); document.addEventListener("mouseup", onUp);
    });
  },
  arrangeIcons() {
    const pos = {};
    DESKTOP_APPS.forEach((id, i) => { pos[id] = { x: 20, y: 20 + i * 96 }; });
    State.desktopIcons = pos; Storage.set("desktopIcons", pos);

      const id = icon.dataset.app;
      if (pos[id]) { icon.style.left = pos[id].x + "px"; icon.style.top = pos[id].y + "px"; }
    });
    Notifications.push("Sistema", "Ícones organizados.", "settings");
  }
};

/* ============== CONTEXT MENU ============== */
function showContextMenu(x, y, items) {
  const menu = $("#context-menu");
  menu.innerHTML = "";
  items.forEach(item => {
    if (item.sep) { menu.appendChild(el("div", { class: "cm-sep" })); return; }
    const it = el("div", { class: "cm-item" }, [el("div", { html: Icons[item.icon] || Icons.files }), el("span", {}, item.label)]);
    it.querySelector("svg").style.width = "15px";
    it.querySelector("svg").style.height = "15px";
    it.addEventListener("click", () => { hideContextMenu(); item.action && item.action(); });
    menu.appendChild(it);
  });
  menu.classList.add("open");
  // força layout para medir
  menu.style.left = "0px"; menu.style.top = "0px";
  const rect = menu.getBoundingClientRect();
  const nx = clamp(x, 5, window.innerWidth - rect.width - 5);
  const ny = clamp(y, 5, window.innerHeight - rect.height - 5);
  menu.style.left = nx + "px"; menu.style.top = ny + "px";
}
function hideContextMenu() { $("#context-menu").classList.remove("open"); }

/* ============== START MENU ============== */
const StartMenu = {
  init() {
    $("#tb-start").addEventListener("click", (e) => { e.stopPropagation(); this.toggle(); });
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#start-menu") && !e.target.closest("#tb-start")) $("#start-menu").classList.remove("open");
    });
    $("#sm-settings").addEventListener("click", () => { openApp("settings"); $("#start-menu").classList.remove("open"); });
    $("#sm-power").addEventListener("click", () => this.powerOff());
    $("#sm-search-input").addEventListener("input", (e) => this.filter(e.target.value));
    this.render();
  },
  toggle() {
    const m = $("#start-menu"); m.classList.toggle("open");
    if (m.classList.contains("open")) setTimeout(() => $("#sm-search-input").focus(), 100);
  },
  render() {
    const pinned = $("#sm-pinned"); const all = $("#sm-all");
    pinned.innerHTML = ""; all.innerHTML = "";
    Object.values(Apps).forEach(app => {
      if (app.pinned) {
        const tile = el("div", { class: "sm-app-tile" }, [el("div", { html: Icons[app.icon] }), el("span", {}, app.name)]);
        tile.querySelector("svg").style.width = "32px"; tile.querySelector("svg").style.height = "32px";
        tile.addEventListener("click", () => { openApp(app.id); $("#start-menu").classList.remove("open"); });
        pinned.appendChild(tile);
      }
      const item = el("div", { class: "sm-all-item" }, [el("div", { html: Icons[app.icon] }), el("span", {}, app.name)]);
      item.querySelector("svg").style.width = "24px"; item.querySelector("svg").style.height = "24px";
      item.addEventListener("click", () => { openApp(app.id); $("#start-menu").classList.remove("open"); });
      all.appendChild(item);
    });
    $("#sm-username").textContent = State.settings.username;
    const av = $("#sm-avatar");
    if (State.settings.avatar) av.innerHTML = `<img src="${State.settings.avatar}">`;
    else av.textContent = (State.settings.username || "U")[0].toUpperCase();
  },
  filter(q) {
    q = q.trim().toLowerCase();
    const all = $("#sm-all"); all.innerHTML = "";
    const matches = Object.values(Apps).filter(a => a.name.toLowerCase().includes(q));
    if (!matches.length) { all.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">Nenhum app encontrado</div>'; return; }
    matches.forEach(app => {
      const item = el("div", { class: "sm-all-item" }, [el("div", { html: Icons[app.icon] }), el("span", {}, app.name)]);
      item.querySelector("svg").style.width = "24px"; item.querySelector("svg").style.height = "24px";
      item.addEventListener("click", () => { openApp(app.id); $("#start-menu").classList.remove("open"); });
      all.appendChild(item);
    });
  },
  powerOff() {
    $("#start-menu").classList.remove("open");
    if (!confirm("Desligar o WebOS?")) return;
    Notifications.push("Sistema", "WebOS desligando...", "settings");
    WindowManager.getWindows().forEach(w => WindowManager.close(w.id));
    Storage.set("openWindows", []);
    setTimeout(() => { location.reload(); }, 1200);
  }
};

/* ============== CLOCK / CALENDAR ============== */
const Clock = {
  calDate: new Date(),
  init() {
    this.tick();
    setInterval(() => this.tick(), 1000);
    $("#tb-clock").addEventListener("click", (e) => { e.stopPropagation(); this.toggleCalendar(); });
    document.addEventListener("click", (e) => { if (!e.target.closest("#calendar-popup") && !e.target.closest("#tb-clock")) $("#calendar-popup").classList.remove("open"); });
    $("#cal-prev").addEventListener("click", () => { this.calDate.setMonth(this.calDate.getMonth() - 1); this.renderCalendar(); });
    $("#cal-next").addEventListener("click", () => { this.calDate.setMonth(this.calDate.getMonth() + 1); this.renderCalendar(); });
  },
  tick() {
    const d = new Date();
    const t = fmtTime(d);
    const dateShort = fmtDateShort(d);
    const tbTime = $("#tb-time"); const tbDate = $("#tb-date");
    if (tbTime) tbTime.textContent = t;
    if (tbDate) tbDate.textContent = dateShort;
    const lc = $("#lock-clock"); const ld = $("#lock-date");
    if (lc) lc.textContent = t;
    if (ld) ld.textContent = fmtDateLong(d);
  },
  toggleCalendar() {
    const p = $("#calendar-popup"); p.classList.toggle("open");
    if (p.classList.contains("open")) { this.calDate = new Date(); this.renderCalendar(); }
  },
  renderCalendar() {
    const grid = $("#cal-grid");
    const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    $("#cal-month").textContent = `${monthNames[this.calDate.getMonth()]} ${this.calDate.getFullYear()}`;
    grid.innerHTML = "";
    ["D","S","T","Q","Q","S","S"].forEach(d => grid.appendChild(el("div", { class: "cal-dow" }, d)));
    const year = this.calDate.getFullYear(), month = this.calDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const daysInPrev = new Date(year, month, 0).getDate();
    const today = new Date();
    for (let i = 0; i < firstDay; i++) grid.appendChild(el("div", { class: "cal-day other" }, String(daysInPrev - firstDay + i + 1)));
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = today.getDate() === d && today.getMonth() === month && today.getFullYear() === year;
      grid.appendChild(el("div", { class: "cal-day" + (isToday ? " today" : "") }, String(d)));
    }
    const total = firstDay + daysInMonth, trailing = (7 - (total % 7)) % 7;
    for (let i = 1; i <= trailing; i++) grid.appendChild(el("div", { class: "cal-day other" }, String(i)));
  }
};

/* ============== SETTINGS APPLICATION ============== */
function applySettings() {
  const s = State.settings;
  document.body.dataset.theme = s.theme;
  document.documentElement.style.setProperty("--accent", s.accent);
  document.documentElement.style.setProperty("--accent-hover", shade(s.accent, 12));
  document.documentElement.style.setProperty("--accent-soft", hexToRgba(s.accent, 0.18));
  document.documentElement.style.setProperty("--win-opacity", s.winOpacity);
  document.documentElement.style.setProperty("--win-blur", s.winBlur + "px");
  document.documentElement.style.setProperty("--ui-scale", s.uiScale || 1);
  const wp = WALLPAPERS[s.wallpaper] || WALLPAPERS.aurora;
  $("#desktop").style.background = wp.startsWith("#") ? wp : wp;
  $("#taskbar").classList.toggle("opaque", s.taskbarOpaque);
  const lockAv = $("#lock-avatar"), lockNm = $("#lock-name");
  if (lockAv) {
    if (s.avatar) lockAv.innerHTML = `<img src="${s.avatar}">`;
    else lockAv.textContent = (s.username || "U")[0].toUpperCase();
  }
  if (lockNm) lockNm.textContent = s.username;
  if (State.booted) StartMenu.render();
  updateVolumeIcon();
}
function saveSettings() { Storage.set("settings", State.settings); applySettings(); }
function updateVolumeIcon() {
  const v = State.settings.volume;
  const btn = $("#tb-volume");
  let icon;
  if (v === 0) icon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l4 6M21 9l-4 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  else if (v < 40) icon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/></svg>`;
  else icon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  btn.innerHTML = icon;
}
function shade(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + percent, g = ((num >> 8) & 0xff) + percent, b = (num & 0xff) + percent;
  r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
  return "#" + ((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}
function hexToRgba(hex, a) {
  const num = parseInt(hex.slice(1), 16);
  return `rgba(${num>>16},${(num>>8)&0xff},${num&0xff},${a})`;
}

/* ============== BATTERY ============== */
let batteryLevel = 100;
function updateBattery() {
  batteryLevel = clamp(batteryLevel - Math.random() * 1.2, 5, 100);
  const txt = $("#battery-text"), fill = $("#battery-fill");
  if (txt) txt.textContent = Math.round(batteryLevel) + "%";
  if (fill) {
    fill.setAttribute("width", Math.round(10 * batteryLevel / 100));
    fill.setAttribute("fill", batteryLevel < 20 ? "#ef4444" : batteryLevel < 50 ? "#f59e0b" : "currentColor");
  }
}

/* ============== GLOBAL SHORTCUTS ============== */
function bindShortcuts() {
  document.addEventListener("keydown", (e) => {
    if (State.locked) {
      if (e.key === "Enter" && !$("#lock-screen").classList.contains("hidden")) { enterDesktop(); }
      return;
    }
    // Super / Meta
    if (e.key === "Meta" || e.key === "OS") {
      e.preventDefault();
      StartMenu.toggle();
    }
    // Alt+Tab
    if (e.altKey && e.key === "Tab") {
      e.preventDefault();
      WindowManager.cycle();
    }
    // Ctrl+Alt+T
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "t") {
      e.preventDefault(); openApp("terminal");
    }
    // Ctrl+Alt+L
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "l") {
      e.preventDefault(); lockScreen();
    }
    // Esc fecha menus
    if (e.key === "Escape") {
      hideContextMenu();
      $("#start-menu").classList.remove("open");
      $("#notif-center").classList.remove("open");
      $("#calendar-popup").classList.remove("open");
    }
  });
}

function lockScreen() {
  if (State.locked) return;
  State.locked = true;
  WindowManager.getWindows().forEach(w => WindowManager.persist());
  $("#lock-screen").classList.remove("hidden");
  $("#desktop").classList.remove("visible");
  Clock.tick();
}

/* ============== BOOT / LOCK ============== */
function boot() {
  applySettings();
  setTimeout(() => {
    $("#boot-screen").classList.add("hidden");
    setTimeout(() => {
      $("#boot-screen").style.display = "none";
      $("#lock-screen").classList.remove("hidden");
      Clock.tick();
    }, 700);
  }, 1900);
}

function enterDesktop() {
  $("#lock-screen").classList.add("hidden");
  $("#desktop").classList.add("visible");
  State.booted = true;
  State.locked = false;
  Desktop.init();
  StartMenu.render();
  Notifications.render();
  // Restaura janelas abertas
  setTimeout(() => WindowManager.restoreAll(), 400);
  setTimeout(() => Notifications.push("WebOS", `Bem-vindo(a), ${State.settings.username}! (v${VERSION})`, "settings"), 800);
  setTimeout(() => Notifications.push("Sistema", "Novidades na v1.0.1! Veja em Configurações → Sobre.", "settings"), 4500);
}

/* ============== INIT ============== */
function init() {
  // Modo escuro automático na primeira visita
  if (!Storage.get("settings", null) && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
    State.settings.theme = "light";
    Storage.set("settings", State.settings);
  }

  $("#lock-enter").addEventListener("click", enterDesktop);

  $("#tb-notif").addEventListener("click", (e) => {
    e.stopPropagation();
    $("#notif-center").classList.toggle("open");
    $("#calendar-popup").classList.remove("open");
  });
  $("#nf-clear").addEventListener("click", () => Notifications.clearAll());
  $("#nf-dnd").addEventListener("click", () => Notifications.setDND(!State.dnd));
  $("#nf-dnd").classList.toggle("active", State.dnd);
  $("#tb-notif").classList.toggle("dnd-active", State.dnd);

  document.addEventListener("click", (e) => {
    if (!e.target.closest("#notif-center") && !e.target.closest("#tb-notif")) $("#notif-center").classList.remove("open");
    if (!e.target.closest("#context-menu")) hideContextMenu();
  });

  $("#tb-wifi").addEventListener("click", () => Notifications.push("Wi-Fi", "Conectado a WebOS-Net (sinal forte).", "settings"));
  $("#tb-volume").addEventListener("click", () => openApp("settings"));

  updateBattery();
  setInterval(updateBattery, 20000);

  Clock.init();
  StartMenu.init();
  bindShortcuts();
  applySettings();
  boot();
}

document.addEventListener("DOMContentLoaded", init);
})();
</script>
