<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebOS 1.0.1</title>
<style>
/* =========================================================
   VARIÁVEIS DE TEMA
   ========================================================= */
:root {
  --accent: #4f8cff;
  --accent-hover: #6ea1ff;
  --accent-soft: rgba(79, 140, 255, 0.18);
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 7px;
  --win-opacity: 0.88;
  --win-blur: 22px;
  --taskbar-h: 52px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
  --transition: 180ms cubic-bezier(.22,.61,.36,1);
  --ui-scale: 1;
}
body[data-theme="dark"] {
  --bg-desktop: #0d1117;
  --bg-window: rgba(28, 32, 40, var(--win-opacity));
  --bg-window-solid: #1c2028;
  --bg-panel: rgba(24, 28, 36, 0.78);
  --bg-hover: rgba(255,255,255,0.08);
  --bg-active: rgba(255,255,255,0.14);
  --text-main: #eef1f6;
  --text-dim: #9aa4b2;
  --text-muted: #6b7480;
  --border-soft: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.18);
  --shadow-window: 0 20px 60px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
  --titlebar-bg: rgba(255,255,255,0.04);
  --scroll-thumb: rgba(255,255,255,0.2);
  --input-bg: rgba(255,255,255,0.07);
  --danger: #ff5f57; --warn: #febc2e; --ok: #28c840;
}
body[data-theme="light"] {
  --bg-desktop: #dfe4ec;
  --bg-window: rgba(250, 251, 253, var(--win-opacity));
  --bg-window-solid: #fafbfd;
  --bg-panel: rgba(248, 249, 252, 0.82);
  --bg-hover: rgba(0,0,0,0.06);
  --bg-active: rgba(0,0,0,0.10);
  --text-main: #1b1f27;
  --text-dim: #5c6470;
  --text-muted: #8b93a1;
  --border-soft: rgba(0,0,0,0.09);
  --border-strong: rgba(0,0,0,0.16);
  --shadow-window: 0 20px 60px rgba(30,40,60,0.22), 0 2px 8px rgba(30,40,60,0.12);
  --titlebar-bg: rgba(0,0,0,0.03);
  --scroll-thumb: rgba(0,0,0,0.22);
  --input-bg: rgba(0,0,0,0.05);
  --danger: #e0443e; --warn: #e0a800; --ok: #1fa93a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font); color: var(--text-main);
  background: var(--bg-desktop); user-select: none;
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition);
  font-size: calc(14px * var(--ui-scale));
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
svg { display: block; }
.hidden { display: none !important; }

/* ============ BOOT ============ */
#boot-screen {
  position: fixed; inset: 0; z-index: 10000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #0a0d12; transition: opacity 700ms ease;
}
#boot-screen.hidden { opacity: 0; pointer-events: none; }
.boot-logo { width: 92px; height: 92px; margin-bottom: 26px; animation: bootPulse 1.6s ease-in-out infinite; filter: drop-shadow(0 0 26px rgba(79,140,255,0.55)); }
@keyframes bootPulse { 0%,100%{transform:scale(1);opacity:.92;} 50%{transform:scale(1.06);opacity:1;} }
.boot-title { font-size: 26px; font-weight: 600; letter-spacing: .5px; color: #eef1f6; margin-bottom: 8px; }
.boot-sub { font-size: 13px; color: #7c8593; margin-bottom: 34px; letter-spacing: .3px; }
.boot-bar { width: 220px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.10); overflow: hidden; position: relative; }
.boot-bar::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, transparent, #4f8cff, transparent); animation: bootBar 1.2s ease-in-out infinite; }
@keyframes bootBar { 0%{left:-40%;} 100%{left:100%;} }
.boot-ver { position: absolute; bottom: 18px; font-size: 11px; color: #4c5867; letter-spacing: .4px; }

/* ============ LOCK ============ */
#lock-screen {
  position: fixed; inset: 0; z-index: 9000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #0f1622 0%, #1a2436 50%, #0d1117 100%);
  color: #eef1f6; transition: opacity 500ms ease, transform 500ms ease;
}
#lock-screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.04); }
.lock-clock { font-size: 84px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
.lock-date { font-size: 16px; color: #9aa4b2; margin-top: 8px; margin-bottom: 52px; text-transform: capitalize; }
.lock-avatar { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #9b6bff); display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 600; color: #fff; margin-bottom: 14px; box-shadow: 0 8px 30px rgba(79,140,255,0.45); overflow: hidden; }
.lock-avatar img { width: 100%; height: 100%; object-fit: cover; }
.lock-name { font-size: 17px; font-weight: 500; margin-bottom: 22px; }
.lock-btn { padding: 11px 34px; border-radius: 999px; background: rgba(255,255,255,0.14); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); font-size: 14px; font-weight: 500; color: #fff; transition: all var(--transition); }
.lock-btn:hover { background: rgba(255,255,255,0.24); transform: translateY(-1px); }
.lock-hint { position: absolute; bottom: 22px; font-size: 11.5px; color: #55606e; }

/* ============ DESKTOP ============ */
#desktop { position: fixed; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 600ms ease; overflow: hidden; }
#desktop.visible { opacity: 1; }
#desktop-icons { position: absolute; inset: 0 0 var(--taskbar-h) 0; pointer-events: none; }
.desk-icon { position: absolute; width: 84px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: var(--radius-md); cursor: pointer; pointer-events: auto; transition: background var(--transition); text-align: center; }
.desk-icon:hover { background: rgba(255,255,255,0.12); }
.desk-icon.selected { background: var(--accent-soft); outline: 1px solid var(--accent); }
.desk-icon svg { width: 44px; height: 44px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.35)); }
.desk-icon span { font-size: 11.5px; color: #fff; font-weight: 500; line-height: 1.25; text-shadow: 0 1px 3px rgba(0,0,0,0.85); max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* ============ TASKBAR ============ */
#taskbar { position: fixed; bottom: 0; left: 0; right: 0; height: var(--taskbar-h); display: flex; align-items: center; padding: 0 10px; gap: 6px; background: var(--bg-panel); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border-top: 1px solid var(--border-soft); z-index: 5000; transition: background var(--transition); }
#taskbar.opaque { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg-window-solid); }
.tb-btn { height: 40px; min-width: 40px; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-sm); transition: background var(--transition), transform var(--transition); position: relative; }
.tb-btn:hover { background: var(--bg-hover); }
.tb-btn:active { transform: scale(0.94); }
.tb-btn svg { width: 22px; height: 22px; }
.tb-app { max-width: 190px; justify-content: flex-start; padding: 0 12px; }
.tb-app span { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-app.minimized { opacity: .55; }
.tb-app .tb-indicator { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 5px; height: 3px; border-radius: 3px; background: var(--accent); transition: width var(--transition); }
.tb-app.active .tb-indicator { width: 16px; }
.tb-spacer { flex: 1; }
#tb-status { display: flex; align-items: center; gap: 2px; }
.tb-status-btn { height: 40px; padding: 0 9px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 6px; font-size: 12px; transition: background var(--transition); }
.tb-status-btn:hover { background: var(--bg-hover); }
.tb-status-btn svg { width: 17px; height: 17px; }
.tb-clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.tb-clock .t { font-size: 12.5px; font-weight: 500; }
.tb-clock .d { font-size: 11px; color: var(--text-dim); }
.tb-badge { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-window-solid); }
.dnd-active { color: var(--accent); }

/* ============ START MENU ============ */
#start-menu { position: fixed; bottom: calc(var(--taskbar-h) + 10px); left: 50%; transform: translateX(-50%) translateY(16px) scale(0.97); width: 620px; max-width: calc(100vw - 20px); height: 540px; max-height: calc(100vh - var(--taskbar-h) - 30px); background: var(--bg-panel); backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-window); z-index: 5100; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity var(--transition), transform var(--transition); overflow: hidden; }
#start-menu.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }
.sm-search { padding: 16px 16px 10px; }
.sm-search input { width: 100%; height: 38px; border-radius: var(--radius-md); border: 1px solid var(--border-soft); background: var(--input-bg); padding: 0 14px; font-size: 13.5px; outline: none; transition: border var(--transition); }
.sm-search input:focus { border-color: var(--accent); }
.sm-search input::placeholder { color: var(--text-muted); }
.sm-body { flex: 1; overflow-y: auto; padding: 4px 16px 12px; }
.sm-section-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px; margin: 14px 4px 10px; display: flex; justify-content: space-between; align-items: center; }
.sm-apps-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.sm-app-tile { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 4px; border-radius: var(--radius-md); transition: background var(--transition), transform var(--transition); cursor: pointer; }
.sm-app-tile:hover { background: var(--bg-hover); transform: translateY(-2px); }
.sm-app-tile svg { width: 32px; height: 32px; }
.sm-app-tile span { font-size: 11.5px; color: var(--text-main); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sm-all-list { display: flex; flex-direction: column; gap: 2px; }
.sm-all-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: var(--radius-sm); transition: background var(--transition); cursor: pointer; }
.sm-all-item:hover { background: var(--bg-hover); }
.sm-all-item svg { width: 24px; height: 24px; flex-shrink: 0; }
.sm-all-item span { font-size: 13.5px; }
.sm-footer { border-top: 1px solid var(--border-soft); padding: 10px 16px; display: flex; align-items: center; gap: 12px; background: var(--titlebar-bg); }
.sm-user { display: flex; align-items: center; gap: 10px; flex: 1; }
.sm-user-avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), #9b6bff); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #fff; }
.sm-user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.sm-user-name { font-size: 13px; font-weight: 500; }
.sm-icon-btn { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; transition: background var(--transition); }
.sm-icon-btn:hover { background: var(--bg-hover); }
.sm-icon-btn svg { width: 19px; height: 19px; }

/* ============ NOTIFICAÇÕES ============ */
#notif-center { position: fixed; bottom: calc(var(--taskbar-h) + 10px); right: 10px; width: 360px; max-width: calc(100vw - 20px); max-height: calc(100vh - var(--taskbar-h) - 30px); background: var(--bg-panel); backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-window); z-index: 5100; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transform: translateY(16px) scale(0.97); transition: opacity var(--transition), transform var(--transition); }
#notif-center.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
.nf-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-soft); }
.nf-header h3 { font-size: 14px; font-weight: 600; }
.nf-header-actions { display: flex; align-items: center; gap: 10px; }
.nf-dnd-btn { font-size: 11px; padding: 4px 9px; border-radius: 6px; background: var(--input-bg); font-weight: 500; }
.nf-dnd-btn.active { background: var(--accent); color: #fff; }
.nf-clear { font-size: 12px; color: var(--accent); font-weight: 500; }
.nf-clear:hover { text-decoration: underline; }
.nf-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.nf-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 10px; }
.nf-group { border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow: hidden; }
.nf-group-head { display: flex; align-items: center; gap: 9px; padding: 9px 11px; background: var(--bg-hover); cursor: pointer; }
.nf-group-head svg { width: 18px; height: 18px; flex-shrink: 0; }
.nf-group-head .nfg-name { flex: 1; font-size: 12.5px; font-weight: 600; }
.nf-group-head .nfg-count { font-size: 11px; background: var(--accent); color: #fff; padding: 1px 7px; border-radius: 10px; }
.nf-group-head .nfg-arrow { font-size: 11px; color: var(--text-muted); transition: transform var(--transition); }
.nf-group.open .nfg-arrow { transform: rotate(90deg); }
.nf-group-body { display: none; padding: 4px 6px; }
.nf-group.open .nf-group-body { display: block; }
.nf-item { background: var(--bg-hover); border-radius: var(--radius-md); padding: 10px 11px; display: flex; gap: 10px; align-items: flex-start; position: relative; margin: 4px 0; animation: nfSlide 260ms ease; }
@keyframes nfSlide { from{opacity:0;transform:translateX(20px);} to{opacity:1;transform:translateX(0);} }
.nf-item-icon { width: 24px; height: 24px; flex-shrink: 0; }
.nf-item-body { flex: 1; min-width: 0; }
.nf-item-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.nf-item-msg { font-size: 11.5px; color: var(--text-dim); line-height: 1.35; word-wrap: break-word; }
.nf-item-time { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; }
.nf-item-close { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px; flex-shrink: 0; }
.nf-item-close:hover { background: var(--bg-active); color: var(--text-main); }

/* Toast */
#toast-container { position: fixed; bottom: calc(var(--taskbar-h) + 14px); right: 14px; z-index: 6000; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { background: var(--bg-panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 12px 14px; width: 300px; box-shadow: var(--shadow-window); display: flex; gap: 10px; align-items: flex-start; animation: toastIn 300ms cubic-bezier(.22,.61,.36,1); }
.toast.out { animation: toastOut 260ms ease forwards; }
@keyframes toastIn { from{opacity:0;transform:translateX(60px);} to{opacity:1;transform:translateX(0);} }
@keyframes toastOut { to{opacity:0;transform:translateX(60px);} }
.toast svg { width: 24px; height: 24px; flex-shrink: 0; }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-size: 12.5px; font-weight: 600; }
.toast-msg { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

/* ============ CALENDÁRIO ============ */
#calendar-popup { position: fixed; bottom: calc(var(--taskbar-h) + 10px); right: 10px; width: 320px; background: var(--bg-panel); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-window); z-index: 5100; padding: 16px; opacity: 0; pointer-events: none; transform: translateY(14px); transition: opacity var(--transition), transform var(--transition); }
#calendar-popup.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-header h4 { font-size: 14px; font-weight: 600; text-transform: capitalize; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav button { width: 26px; height: 26px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; transition: background var(--transition); }
.cal-nav button:hover { background: var(--bg-hover); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-dow { font-size: 10.5px; font-weight: 600; color: var(--text-muted); padding: 5px 0; }
.cal-day { font-size: 12px; padding: 6px 0; border-radius: var(--radius-sm); transition: background var(--transition); cursor: default; }
.cal-day.other { color: var(--text-muted); opacity: .4; }
.cal-day.today { background: var(--accent); color: #fff; font-weight: 600; }
.cal-day:not(.other):hover { background: var(--bg-hover); }

/* ============ JANELAS ============ */
#windows-layer { position: fixed; inset: 0 0 var(--taskbar-h) 0; pointer-events: none; z-index: 1000; }
.window { position: absolute; pointer-events: auto; background: var(--bg-window); backdrop-filter: blur(var(--win-blur)) saturate(150%); -webkit-backdrop-filter: blur(var(--win-blur)) saturate(150%); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-window); display: flex; flex-direction: column; overflow: hidden; min-width: 320px; min-height: 220px; animation: winOpen 220ms cubic-bezier(.22,.61,.36,1); transition: opacity 160ms ease, transform 160ms ease; }
.window.closing { opacity: 0; transform: scale(0.96); pointer-events: none; }
.window.minimized { opacity: 0; transform: scale(0.9) translateY(40px); pointer-events: none; }
@keyframes winOpen { from{opacity:0;transform:scale(0.94) translateY(10px);} to{opacity:1;transform:scale(1) translateY(0);} }
.window.maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }
.window.snapped-left { top: 0 !important; left: 0 !important; width: 50% !important; height: 100% !important; border-radius: 0; }
.window.snapped-right { top: 0 !important; left: 50% !important; width: 50% !important; height: 100% !important; border-radius: 0; }
.win-titlebar { height: 38px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px 0 12px; gap: 8px; background: var(--titlebar-bg); border-bottom: 1px solid var(--border-soft); cursor: grab; }
.win-titlebar:active { cursor: grabbing; }
.win-titlebar .win-app-icon { width: 17px; height: 17px; flex-shrink: 0; }
.win-title { flex: 1; font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win-controls { display: flex; gap: 3px; }
.win-ctrl { width: 30px; height: 26px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; transition: background var(--transition); }
.win-ctrl:hover { background: var(--bg-hover); }
.win-ctrl.close:hover { background: var(--danger); color: #fff; }
.win-ctrl svg { width: 13px; height: 13px; }
.win-body { flex: 1; overflow: hidden; position: relative; }
.win-resize { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; z-index: 5; }
.win-resize::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px; border-right: 2px solid var(--text-muted); border-bottom: 2px solid var(--text-muted); border-radius: 1px; }
.window.maximized .win-resize, .window.snapped-left .win-resize, .window.snapped-right .win-resize { display: none; }

/* Snap preview */
#snap-preview { position: fixed; border: 2px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius-lg); z-index: 999; pointer-events: none; opacity: 0; transition: opacity 120ms ease; }
#snap-preview.visible { opacity: 1; }

/* App genérico */
.app-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border-soft); background: var(--titlebar-bg); flex-shrink: 0; flex-wrap: wrap; }
.app-btn { height: 30px; padding: 0 12px; border-radius: var(--radius-sm); background: var(--input-bg); font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background var(--transition), transform var(--transition); }
.app-btn:hover { background: var(--bg-active); }
.app-btn:active { transform: scale(0.96); }
.app-btn.primary { background: var(--accent); color: #fff; }
.app-btn.primary:hover { background: var(--accent-hover); }
.app-btn.danger { color: var(--danger); }
.app-btn svg { width: 14px; height: 14px; }
.app-content { flex: 1; overflow: auto; }
.app-pane { padding: 14px; }
.app-input { height: 32px; padding: 0 11px; border-radius: var(--radius-sm); border: 1px solid var(--border-soft); background: var(--input-bg); font-size: 13px; outline: none; width: 100%; }
.app-input:focus { border-color: var(--accent); }

/* Explorador de arquivos */
.fm-layout { display: flex; height: 100%; }
.fm-sidebar { width: 168px; flex-shrink: 0; border-right: 1px solid var(--border-soft); padding: 10px 8px; overflow-y: auto; background: var(--titlebar-bg); }
.fm-side-item { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: var(--radius-sm); font-size: 12.5px; cursor: pointer; transition: background var(--transition); margin-bottom: 2px; }
.fm-side-item:hover { background: var(--bg-hover); }
.fm-side-item.active { background: var(--accent-soft); color: var(--accent); }
.fm-side-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.fm-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.fm-path { padding: 9px 12px; border-bottom: 1px solid var(--border-soft); font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.fm-path .crumb { cursor: pointer; padding: 2px 5px; border-radius: 4px; }
.fm-path .crumb:hover { background: var(--bg-hover); color: var(--text-main); }
.fm-path .sep { color: var(--text-muted); }
.fm-items { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; align-content: start; }
.fm-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 5px; border-radius: var(--radius-md); cursor: pointer; transition: background var(--transition); text-align: center; }
.fm-item:hover { background: var(--bg-hover); }
.fm-item.selected { background: var(--accent-soft); }
.fm-item svg { width: 36px; height: 36px; }
.fm-item span { font-size: 11.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fm-empty { grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 10px; }

/* Modal */
.modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 20; animation: fadeIn 150ms ease; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.modal-box { background: var(--bg-window-solid); border-radius: var(--radius-md); box-shadow: var(--shadow-window); padding: 20px; width: 320px; max-width: 90%; animation: winOpen 200ms ease; }
.modal-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
.modal-box .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

/* Navegador */
.br-tabs { display: flex; align-items: center; gap: 3px; padding: 7px 8px 0; background: var(--titlebar-bg); overflow-x: auto; flex-shrink: 0; }
.br-tab { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; font-size: 12px; background: var(--bg-hover); cursor: pointer; max-width: 170px; min-width: 90px; white-space: nowrap; overflow: hidden; transition: background var(--transition); }
.br-tab span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.br-tab.active { background: var(--bg-window-solid); }
.br-tab .br-tab-close { width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.br-tab .br-tab-close:hover { background: var(--danger); color: #fff; }
.br-newtab-btn { width: 26px; height: 26px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.br-newtab-btn:hover { background: var(--bg-hover); }
.br-bar { display: flex; align-items: center; gap: 6px; padding: 8px; flex-shrink: 0; border-bottom: 1px solid var(--border-soft); }
.br-nav-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.br-nav-btn:hover:not(:disabled) { background: var(--bg-hover); }
.br-nav-btn:disabled { opacity: .35; cursor: default; }
.br-address { flex: 1; height: 30px; border-radius: 999px; background: var(--input-bg); border: 1px solid var(--border-soft); padding: 0 14px; font-size: 12.5px; outline: none; }
.br-address:focus { border-color: var(--accent); background: var(--bg-window-solid); }
.br-view { flex: 1; background: var(--bg-window-solid); position: relative; overflow: hidden; }
.br-view iframe { width: 100%; height: 100%; border: none; background: #fff; }
.br-home { height: 100%; overflow-y: auto; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(160deg, var(--bg-window-solid), var(--bg-desktop)); }
.br-home h1 { font-size: 30px; font-weight: 700; margin-bottom: 18px; letter-spacing: -.5px; }
.br-home-search { width: 100%; max-width: 480px; height: 42px; border-radius: 999px; border: 1px solid var(--border-soft); background: var(--bg-window-solid); padding: 0 18px; font-size: 14px; outline: none; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.br-home-search:focus { border-color: var(--accent); }
.br-shortcuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; width: 100%; max-width: 480px; }
.br-shortcut { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: var(--radius-md); cursor: pointer; transition: background var(--transition); }
.br-shortcut:hover { background: var(--bg-hover); }
.br-shortcut .sc-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; color: #fff; }
.br-shortcut span { font-size: 11.5px; color: var(--text-dim); }
.br-blocked { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; gap: 12px; }
.br-blocked svg { width: 54px; height: 54px; color: var(--text-muted); }
.br-blocked p { font-size: 13.5px; color: var(--text-dim); max-width: 380px; line-height: 1.5; }

/* Bloco de notas */
.np-layout { display: flex; height: 100%; flex-direction: column; }
.np-editor { flex: 1; width: 100%; border: none; outline: none; resize: none; background: transparent; color: var(--text-main); font-family: "SFMono-Regular", Consolas, "Courier New", monospace; font-size: 13.5px; line-height: 1.65; padding: 16px; }
.np-statusbar { height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border-soft); background: var(--titlebar-bg); }
.np-autosave { display: flex; align-items: center; gap: 5px; font-size: 11px; }

/* Calculadora */
.calc-wrap { height: 100%; display: flex; flex-direction: column; padding: 12px; }
.calc-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.calc-mode-toggle { font-size: 11.5px; padding: 4px 10px; border-radius: 6px; background: var(--input-bg); font-weight: 500; }
.calc-mode-toggle.active { background: var(--accent); color: #fff; }
.calc-display { background: var(--input-bg); border-radius: var(--radius-md); padding: 14px; text-align: right; margin-bottom: 10px; flex-shrink: 0; }
.calc-expr { font-size: 11.5px; color: var(--text-muted); height: 15px; overflow: hidden; }
.calc-result { font-size: 32px; font-weight: 300; letter-spacing: -.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calc-grid { flex: 1; display: grid; gap: 6px; grid-template-columns: repeat(4, 1fr); }
.calc-grid.sci { grid-template-columns: repeat(5, 1fr); }
.calc-btn { border-radius: var(--radius-md); background: var(--input-bg); font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; transition: background var(--transition), transform 80ms; }
.calc-btn:hover { background: var(--bg-active); }
.calc-btn:active { transform: scale(0.95); }
.calc-btn.op { color: var(--accent); }
.calc-btn.eq { background: var(--accent); color: #fff; }
.calc-btn.eq:hover { background: var(--accent-hover); }
.calc-btn.fn { font-size: 13px; color: var(--text-dim); }
.calc-sci-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 6px; }
.calc-sci-btn { height: 34px; border-radius: var(--radius-md); background: var(--input-bg); font-size: 11.5px; color: var(--text-dim); display: flex; align-items: center; justify-content: center; }
.calc-sci-btn:hover { background: var(--bg-active); color: var(--text-main); }
.calc-history { display: none; position: absolute; inset: 0; background: var(--bg-window-solid); z-index: 10; flex-direction: column; }
.calc-history.open { display: flex; }
.calc-hist-header { padding: 10px 14px; border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; }
.calc-hist-header h4 { font-size: 13px; font-weight: 600; }
.calc-hist-list { flex: 1; overflow-y: auto; padding: 8px; }
.calc-hist-item { padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background var(--transition); }
.calc-hist-item:hover { background: var(--bg-hover); }
.calc-hist-item .ch-expr { font-size: 11px; color: var(--text-muted); }
.calc-hist-item .ch-res { font-size: 15px; font-weight: 500; }

/* Galeria */
.gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 12px; }
.gal-thumb { aspect-ratio: 1; border-radius: var(--radius-md); overflow: hidden; cursor: pointer; position: relative; background: var(--input-bg); transition: transform var(--transition); }
.gal-thumb:hover { transform: scale(1.03); }
.gal-thumb img { width: 100%; height: 100%; object-fit: cover; }
.gal-thumb .gal-del { position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; display: none; align-items: center; justify-content: center; font-size: 13px; }
.gal-thumb:hover .gal-del { display: flex; }
.gal-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 50px 20px; }
.gal-viewer { position: absolute; inset: 0; background: rgba(0,0,0,0.92); z-index: 30; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.gal-viewer img { max-width: 92%; max-height: 92%; border-radius: 6px; box-shadow: 0 10px 50px rgba(0,0,0,.7); transition: transform 120ms ease; }
.gal-viewer .gv-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.14); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.gal-viewer .gv-nav:hover { background: rgba(255,255,255,0.26); }
.gal-viewer .gv-prev { left: 16px; }
.gal-viewer .gv-next { right: 16px; }
.gal-viewer .gv-close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.14); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.gal-viewer .gv-name { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 12px; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 999px; }
.gal-viewer .gv-slideshow { position: absolute; top: 14px; left: 14px; height: 32px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,0.14); color: #fff; font-size: 12px; font-weight: 500; }
.gal-viewer .gv-slideshow.active { background: var(--accent); }

/* Terminal */
.term-body { height: 100%; background: #0b0e13; color: #cfd8e3; font-family: "SFMono-Regular", Consolas, "Courier New", monospace; font-size: 12.8px; line-height: 1.55; padding: 14px; overflow-y: auto; }
.term-line { white-space: pre-wrap; word-break: break-word; }
.term-line .prompt { color: var(--accent); }
.term-line .path { color: #6ee7a8; }
.term-line .err { color: #ff7a7a; }
.term-input-line { display: flex; gap: 6px; }
.term-input-line .prompt { color: var(--accent); white-space: nowrap; }
.term-input { flex: 1; background: transparent; border: none; outline: none; color: #cfd8e3; font-family: inherit; font-size: inherit; padding: 0; }
.term-neofetch { display: flex; gap: 18px; margin: 6px 0; }
.term-neofetch pre { color: var(--accent); line-height: 1.25; font-size: 11px; }

/* Gerenciador de tarefas */
.tm-summary { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border-soft); }
.tm-card { flex: 1; background: var(--input-bg); border-radius: var(--radius-md); padding: 10px 12px; }
.tm-card .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
.tm-card .val { font-size: 21px; font-weight: 600; margin-top: 3px; }
.tm-card .bar { height: 4px; border-radius: 4px; background: var(--bg-hover); margin-top: 7px; overflow: hidden; }
.tm-card .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width 500ms ease; }
.tm-list { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.tm-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); transition: background var(--transition); }
.tm-row:hover { background: var(--bg-hover); }
.tm-row svg { width: 20px; height: 20px; flex-shrink: 0; }
.tm-row .tm-name { flex: 1; font-size: 12.8px; }
.tm-row .tm-metric { font-size: 11.5px; color: var(--text-dim); min-width: 60px; text-align: right; }
.tm-kill { font-size: 11px; padding: 4px 10px; border-radius: var(--radius-sm); background: var(--input-bg); color: var(--danger); font-weight: 500; }
.tm-kill:hover { background: var(--danger); color: #fff; }

/* Configurações */
.set-layout { display: flex; height: 100%; }
.set-nav { width: 168px; flex-shrink: 0; border-right: 1px solid var(--border-soft); padding: 10px 8px; background: var(--titlebar-bg); overflow-y: auto; }
.set-nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 12.5px; cursor: pointer; transition: background var(--transition); margin-bottom: 2px; }
.set-nav-item:hover { background: var(--bg-hover); }
.set-nav-item.active { background: var(--accent-soft); color: var(--accent); }
.set-nav-item svg { width: 16px; height: 16px; }
.set-content { flex: 1; overflow-y: auto; padding: 20px 22px; }
.set-section { display: none; }
.set-section.active { display: block; }
.set-section h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.set-section > p { font-size: 12.5px; color: var(--text-dim); margin-bottom: 20px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--border-soft); }
.set-row:last-child { border-bottom: none; }
.set-row .sr-label { font-size: 13.5px; font-weight: 500; }
.set-row .sr-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.set-row .sr-control { flex-shrink: 0; }
.set-theme-toggle { display: flex; gap: 6px; }
.set-theme-toggle button { width: 74px; height: 52px; border-radius: var(--radius-md); border: 2px solid var(--border-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px; transition: all var(--transition); }
.set-theme-toggle button.active { border-color: var(--accent); background: var(--accent-soft); }
.set-theme-toggle .preview { width: 26px; height: 16px; border-radius: 4px; border: 1px solid var(--border-soft); }
.set-color-grid { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.set-color-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform var(--transition); }
.set-color-dot:hover { transform: scale(1.12); }
.set-color-dot.active { border-color: var(--text-main); box-shadow: 0 0 0 2px var(--bg-window-solid) inset; }
.set-color-custom { width: 26px; height: 26px; padding: 0; border: none; background: none; cursor: pointer; border-radius: 50%; overflow: hidden; }
.set-wallpaper-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.set-wp { aspect-ratio: 16/10; border-radius: var(--radius-sm); cursor: pointer; border: 2px solid transparent; transition: border var(--transition); background-size: cover; background-position: center; }
.set-wp.active { border-color: var(--accent); }
.set-range { width: 140px; accent-color: var(--accent); }
.set-avatar-preview { width: 62px; height: 62px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, var(--accent), #9b6bff); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; color: #fff; }
.set-avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.set-about-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.set-about-logo svg { width: 56px; height: 56px; }
.set-about-logo .v { font-size: 22px; font-weight: 600; }
.set-about-logo .s { font-size: 12px; color: var(--text-muted); }
.set-changelog { background: var(--input-bg); border-radius: var(--radius-md); padding: 12px 14px; font-size: 12px; line-height: 1.7; color: var(--text-dim); max-height: 220px; overflow-y: auto; }
.set-changelog h4 { color: var(--text-main); font-size: 12.5px; margin-bottom: 4px; }
.set-changelog ul { padding-left: 16px; margin: 4px 0 10px; }
.set-changelog li { margin-bottom: 3px; }

/* Menu de contexto */
#context-menu { position: fixed; z-index: 7000; min-width: 180px; background: var(--bg-panel); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border-soft); border-radius: var(--radius-md); box-shadow: var(--shadow-window); padding: 5px; opacity: 0; pointer-events: none; transform: scale(0.96); transition: opacity 120ms ease, transform 120ms ease; transform-origin: top left; }
#context-menu.open { opacity: 1; pointer-events: auto; transform: scale(1); }
.cm-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm); font-size: 12.5px; cursor: pointer; transition: background var(--transition); }
.cm-item:hover { background: var(--bg-hover); }
.cm-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.cm-sep { height: 1px; background: var(--border-soft); margin: 5px 6px; }

/* Responsivo */
@media (max-width: 720px) {
  .sm-apps-grid { grid-template-columns: repeat(4, 1fr); }
  #start-menu { width: calc(100vw - 20px); }
  .lock-clock { font-size: 60px; }
  .fm-sidebar, .set-nav { width: 120px; }
}
</style>

  push(title, message, icon) {

    State.notifications.unshift(item);
    if (State.notifications.length > 50) State.notifications.pop();
    Storage.set("notifications", State.notifications);
    this.render();
    if (!State.dnd) this.toast(title, message, icon);
    AudioFX.ding();
  },
  dismiss(id) {
    State.notifications = State.notifications.filter(n => n.id !== id);

  },
  clearAll() {
    State.notifications = [];

    this.render();

  setDND(val) {
    State.dnd = val;

  render() {
    const list = $("#nf-list");

    if (State.notifications.length === 0) {
      list.innerHTML = '<div class="nf-empty">Nenhuma notificação</div>';
    } else {
      // Agrupar por título
      const groups = {};
      State.notifications.forEach(n => {
        if (!groups[n.title]) groups[n.title] = { title: n.title, icon: n.icon, items: [] };
        groups[n.title].items.push(n);
      });
      Object.values(groups).forEach(g => {
        if (g.items.length === 1) {
          // single
          const n = g.items[0];
          const node = el("div", { class: "nf-item" }, [
            el("div", { class: "nf-item-icon", html: Icons[n.icon] || Icons.files }),
            el("div", { class: "nf-item-body" }, [
              el("div", { class: "nf-item-title" }, n.title),
              el("div", { class: "nf-item-msg" }, n.message),
              el("div", { class: "nf-item-time" }, n.time)
            ]),
            el("button", { class: "nf-item-close", onclick: () => this.dismiss(n.id), html: "×" })
          ]);
          list.appendChild(node);

          const grp = el("div", { class: "nf-group" });
          const head = el("div", { class: "nf-group-head" }, [
            el("div", { html: Icons[g.icon] || Icons.files }),
            el("div", { class: "nfg-name" }, g.title),
            el("div", { class: "nfg-count" }, String(g.items.length)),
            el("div", { class: "nfg-arrow" }, "▸")
          ]);
          head.addEventListener("click", () => grp.classList.toggle("open"));
          grp.appendChild(head);
          const body = el("div", { class: "nf-group-body" });
          g.items.forEach(n => {
            body.appendChild(el("div", { class: "nf-item" }, [
              el("div", { class: "nf-item-icon", html: Icons[n.icon] || Icons.files }),
              el("div", { class: "nf-item-body" }, [
                el("div", { class: "nf-item-msg" }, n.message),
                el("div", { class: "nf-item-time" }, n.time)
              ]),
              el("button", { class: "nf-item-close", onclick: () => this.dismiss(n.id), html: "×" })
            ]));
          });
          grp.appendChild(body);
          list.appendChild(grp);
        }
      });
    }
    const badge = $("#notif-badge");
    badge.style.display = State.notifications.length ? "block" : "none";
  },

    const t = el("div", { class: "toast" }, [

      win.y = clamp(40 + offset, 10, layerRect.height - h - 10);
    }

    const winEl = el("div", { class: "window", style: { left: win.x + "px", top: win.y + "px", width: w + "px", height: h + "px", zIndex: ++State.zTop } });
    winEl.innerHTML = `
      <div class="win-titlebar">
        <div class="win-app-icon">${Icons[win.icon] || Icons.files}</div>
        <div class="win-title">${win.title}</div>
        <div class="win-controls">
          <button class="win-ctrl min" aria-label="Minimizar" title="Minimizar"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
          <button class="win-ctrl max" aria-label="Maximizar" title="Maximizar"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="5" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2"/></svg></button>
          <button class="win-ctrl close" aria-label="Fechar" title="Fechar"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        </div>
      </div>
      <div class="win-body"></div>
      <div class="win-resize"></div>
    `;
    $("#windows-layer").appendChild(winEl);
    win.el = winEl;

    winEl.addEventListener("mousedown", () => this.focus(id));
    winEl.querySelector(".win-ctrl.min").addEventListener("click", e => { e.stopPropagation(); this.minimize(id); });
    winEl.querySelector(".win-ctrl.max").addEventListener("click", e => { e.stopPropagation(); this.toggleMaximize(id); });
    winEl.querySelector(".win-ctrl.close").addEventListener("click", e => { e.stopPropagation(); this.close(id); });

    // duplo clique titlebar maximiza
    winEl.querySelector(".win-titlebar").addEventListener("dblclick", (e) => {
      if (e.target.closest(".win-ctrl")) return;
      this.toggleMaximize(id);
    });

    this._makeDraggable(win);
    this._makeResizable(win);

    State.windows.set(id, win);
    this.focus(id);
    Taskbar.renderApps();
    if (opts.onMount) {
      try { opts.onMount(winEl.querySelector(".win-body"), win); }
      catch(e) { console.error(e); winEl.querySelector(".win-body").innerHTML = `<div class="app-pane"><p>Erro ao abrir app: ${e.message}</p></div>`; }
    }
    this.persist();
    return win;
  },

  _makeDraggable(win) {
    const bar = win.el.querySelector(".win-titlebar");
    let startX, startY, startL, startT, dragging = false;
    const snapPreview = $("#snap-preview");
    let currentSnapZone = null;
    const onDown = (e) => {
      if (e.target.closest(".win-ctrl")) return;
      if (win.maximized) return;
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      startL = win.el.offsetLeft; startT = win.el.offsetTop;
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    };
    const onMove = (e) => {
      if (!dragging) return;
      const layerRect = $("#windows-layer").getBoundingClientRect();
      let nx = clamp(startL + (e.clientX - startX), -win.width + 80, layerRect.width - 80);
      let ny = clamp(startT + (e.clientY - startY), 0, layerRect.height - 40);
      win.el.style.left = nx + "px"; win.el.style.top = ny + "px";
      win.x = nx; win.y = ny;
      // snap zones
      const zone = e.clientX < 12 ? "left" : e.clientX > window.innerWidth - 12 ? "right" : e.clientY < 8 ? "top" : null;
      if (zone !== currentSnapZone) {
        currentSnapZone = zone;
        if (zone) {
          snapPreview.classList.add("visible");
          const lr = $("#windows-layer").getBoundingClientRect();
          if (zone === "left") Object.assign(snapPreview.style, { left: "0px", top: "0px", width: "50%", height: lr.height + "px" });
          else if (zone === "right") Object.assign(snapPreview.style, { left: (lr.width/2) + "px", top: "0px", width: (lr.width/2) + "px", height: lr.height + "px" });
          else Object.assign(snapPreview.style, { left: "0px", top: "0px", width: lr.width + "px", height: lr.height + "px" });
        } else snapPreview.classList.remove("visible");
      }
    };
    const onUp = () => {
      dragging = false;
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      snapPreview.classList.remove("visible");
      if (currentSnapZone) {
        win.el.classList.remove("snapped-left", "snapped-right", "maximized");
        if (currentSnapZone === "left") win.el.classList.add("snapped-left");
        else if (currentSnapZone === "right") win.el.classList.add("snapped-right");
        else this.toggleMaximize(win.id);
        win.snapped = currentSnapZone;
        currentSnapZone = null;
      }
      this.persist();
    };
    bar.addEventListener("mousedown", onDown);
    bar.addEventListener("touchstart", (e) => {
      if (e.target.closest(".win-ctrl")) return;
      if (win.maximized) return;
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      startL = win.el.offsetLeft; startT = win.el.offsetTop;
      dragging = true;
    }, {passive: true});
    bar.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      const t = e.touches[0];
      const layerRect = $("#windows-layer").getBoundingClientRect();
      let nx = clamp(startL + (t.clientX - startX), -win.width + 80, layerRect.width - 80);
      let ny = clamp(startT + (t.clientY - startY), 0, layerRect.height - 40);
      win.el.style.left = nx + "px"; win.el.style.top = ny + "px";
      win.x = nx; win.y = ny;
    }, {passive: true});
    bar.addEventListener("touchend", () => { dragging = false; });
  },

  _makeResizable(win) {
    const handle = win.el.querySelector(".win-resize");
    let resizing = false, sx, sy, sw, sh;
    handle.addEventListener("mousedown", (e) => {
      e.stopPropagation();
      resizing = true;
      sx = e.clientX; sy = e.clientY;
      sw = win.el.offsetWidth; sh = win.el.offsetHeight;
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    const onMove = (e) => {
      if (!resizing) return;
      const nw = clamp(sw + (e.clientX - sx), 320, window.innerWidth - 20);
      const nh = clamp(sh + (e.clientY - sy), 220, window.innerHeight - 80);
      win.el.style.width = nw + "px"; win.el.style.height = nh + "px";
      win.width = nw; win.height = nh;
    };
    const onUp = () => { resizing = false; document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); this.persist(); };
  },

  focus(id) {
    const win = State.windows.get(id);
    if (!win) return;
    State.windows.forEach(w => w.el.style.zIndex = 1000);
    win.el.style.zIndex = ++State.zTop;
    if (win.minimized) {
      win.minimized = false;
      win.el.classList.remove("minimized");
    }
    Taskbar.renderApps();
  },

  minimize(id) {
    const win = State.windows.get(id);
    if (!win) return;
    win.minimized = true;
    win.el.classList.add("minimized");
    Taskbar.renderApps();
    this.persist();
  },

  toggleMaximize(id) {
    const win = State.windows.get(id);
    if (!win) return;
    win.maximized = !win.maximized;
    win.el.classList.remove("snapped-left", "snapped-right");
    win.snapped = null;
    if (win.maximized) {
      win._restore = { x: win.el.style.left, y: win.el.style.top, w: win.el.style.width, h: win.el.style.height };
      win.el.classList.add("maximized");
    } else {
      win.el.classList.remove("maximized");
      if (win._restore) Object.assign(win.el.style, win._restore);
    }
    this.persist();
  },

  close(id) {
    const win = State.windows.get(id);
    if (!win) return;
    if (win.onClose) try { win.onClose(); } catch(e) {}
    win.el.classList.add("closing");
    setTimeout(() => {
      win.el.remove();
      State.windows.delete(id);
      Taskbar.renderApps();
      this.persist();
    }, 180);
  },

  restoreOrMinimize(id) {
    const win = State.windows.get(id);
    if (!win) return;
    if (win.minimized) this.focus(id);
    else if (win.el.style.zIndex == State.zTop) this.minimize(id);
    else this.focus(id);
  },

  getWindows() { return Array.from(State.windows.values()); },

  persist() {
    const data = this.getWindows().filter(w => !w.noPersist).map(w => ({
      appId: w.appId, title: w.title, icon: w.icon,
      x: w.el.offsetLeft, y: w.el.offsetTop,
      width: w.el.offsetWidth, height: w.el.offsetHeight,
      maximized: w.maximized, snapped: w.snapped
    }));
    Storage.set("openWindows", data);
    State.openWindowsCache = data;
  },

  cycle() {
    const wins = this.getWindows().sort((a, b) => parseInt(b.el.style.zIndex) - parseInt(a.el.style.zIndex));
    if (wins.length < 2) return;
    // Foca a próxima
    const next = wins[1];
    this.focus(next.id);
  },

  restoreAll() {
    const data = State.openWindowsCache;
    if (!data || !data.length) return;
    data.forEach(d => {
      const app = Apps[d.appId];
      if (!app) return;
      WindowManager.create({
        appId: d.appId, title: d.title, icon: d.icon,
        width: d.width, height: d.height, x: d.x, y: d.y,
        onMount: (body, win) => {
          const cleanup = app.mount(body, win);
          if (typeof cleanup === "function") win.onClose = cleanup;
          if (d.maximized) win.el.classList.add("maximized");
          if (d.snapped === "left") win.el.classList.add("snapped-left");
          if (d.snapped === "right") win.el.classList.add("snapped-right");
        }
      });
    });
  }
};

const Apps = {};
function registerApp(meta) { Apps[meta.id] = meta; }

/* --- EXPLORADOR --- */
registerApp({
  id: "files", name: "Arquivos", icon: "files", pinned: true,
  mount(root) {
    let currentId = "root", selectedId = null;
    root.innerHTML = `
      <div class="fm-layout">
        <div class="fm-sidebar" id="fm-sidebar"></div>
        <div class="fm-main">
          <div class="app-toolbar">
            <button class="app-btn" data-act="newfolder">+ Pasta</button>
            <button class="app-btn" data-act="newfile">+ Arquivo</button>
            <button class="app-btn" data-act="rename">Renomear</button>
            <button class="app-btn danger" data-act="delete">Excluir</button>
            <button class="app-btn" data-act="props">Propriedades</button>
            <button class="app-btn" data-act="trash">🗑️ Lixeira</button>
          </div>
          <div class="fm-path" id="fm-path"></div>
          <div class="fm-items" id="fm-items"></div>
        </div>
      </div>
    `;
    const sidebar = root.querySelector("#fm-sidebar");
    const items = root.querySelector("#fm-items");
    const pathEl = root.querySelector("#fm-path");

    function renderSidebar() {
      sidebar.innerHTML = "";
      const places = [
        { id: "root", label: "Início", icon: "home" },
        { id: "docs", label: "Documentos", icon: "folder" },
        { id: "downloads", label: "Downloads", icon: "download" },
        { id: "pics", label: "Imagens", icon: "image" },
        { id: "music", label: "Músicas", icon: "music" }
      ];
      places.forEach(p => {
        const item = el("div", { class: "fm-side-item" + (currentId === p.id ? " active" : "") }, [
          el("div", { html: Icons[p.icon] || Icons.folder }),
          el("span", {}, p.label)
        ]);
        item.querySelector("svg").style.width = "16px";
        item.querySelector("svg").style.height = "16px";
        item.addEventListener("click", () => { currentId = p.id; selectedId = null; render(); });
        sidebar.appendChild(item);
      });
      if (State.trash.length > 0) {
        const tr = el("div", { class: "fm-side-item" }, [
          el("div", { html: Icons.trash }),
          el("span", {}, `Lixeira (${State.trash.length})`)
        ]);
        tr.querySelector("svg").style.width = "16px";
        tr.querySelector("svg").style.height = "16px";
        tr.addEventListener("click", () => openTrash());
        sidebar.appendChild(tr);
      }
    }

    function render() {
      const node = findNode(currentId);
      if (!node) { currentId = "root"; return render(); }
      const folder = node.node;
      const pth = [];
      let cur = folder;
      while (cur) { pth.unshift(cur); cur = cur.parent; }
      pathEl.innerHTML = "";
      pth.forEach((p, i) => {
        const crumb = el("span", { class: "crumb" }, p.name);
        crumb.addEventListener("click", () => { currentId = p.id; render(); });
        pathEl.appendChild(crumb);
        if (i < pth.length - 1) pathEl.appendChild(el("span", { class: "sep" }, "›"));
      });
      items.innerHTML = "";
      const kids = (folder.children || []).slice().sort((a,b) => {
        if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      if (kids.length === 0) items.innerHTML = '<div class="fm-empty">Pasta vazia</div>';
      kids.forEach(child => {
        const iconSvg = child.type === "folder" ? Icons.folder : Icons.file;
        const item = el("div", { class: "fm-item" + (child.id === selectedId ? " selected" : "") }, [
          el("div", { html: iconSvg }),
          el("span", {}, child.name)
        ]);
        item.querySelector("svg").style.width = "36px";
        item.querySelector("svg").style.height = "36px";
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          selectedId = child.id;
          $$(".fm-item", items).forEach(n => n.classList.remove("selected"));
          item.classList.add("selected");
        });
        item.addEventListener("dblclick", () => {
          if (child.type === "folder") { currentId = child.id; selectedId = null; render(); }
          else openFile(child);
        });
        items.appendChild(item);
      });
      renderSidebar();
    }

    function openTrash() {
      const trashWin = WindowManager.create({
        appId: "trash-view", title: "Lixeira", icon: "trash", width: 560, height: 420, noPersist: true,
        onMount(body) {
          body.innerHTML = `
            <div class="app-toolbar"><button class="app-btn" id="trash-empty">Esvaziar lixeira</button><button class="app-btn" id="trash-restore">Restaurar selecionado</button></div>
            <div class="fm-items" id="trash-items" style="padding:10px;"></div>
          `;
          function renderTrash() {
            const cont = body.querySelector("#trash-items");
            cont.innerHTML = "";
            if (State.trash.length === 0) { cont.innerHTML = '<div class="fm-empty" style="grid-column:1/-1;">Lixeira vazia</div>'; return; }
            State.trash.forEach((it, i) => {
              const node = el("div", { class: "fm-item" }, [
                el("div", { html: Icons.file }),
                el("span", {}, it.node.name)
              ]);
              node.querySelector("svg").style.width = "36px";
              node.querySelector("svg").style.height = "36px";
              node.addEventListener("click", () => {
                $$(".fm-item", cont).forEach(n => n.classList.remove("selected"));
                node.classList.add("selected");
                cont.dataset.sel = i;
              });
              cont.appendChild(node);
            });
          }
          body.querySelector("#trash-empty").addEventListener("click", () => {
            if (!confirm("Esvaziar a lixeira permanentemente?")) return;
            State.trash = []; Storage.set("trash", State.trash); renderTrash(); render();
            Notifications.push("Lixeira", "Lixeira esvaziada.", "trash");
          });
          body.querySelector("#trash-restore").addEventListener("click", () => {
            const idx = parseInt(body.querySelector("#trash-items").dataset.sel || "-1");
            if (idx < 0 || !State.trash[idx]) return alert("Selecione um item.");
            const it = State.trash.splice(idx, 1)[0];
            const parent = findNode(it.parentId);
            if (parent && parent.node.children) parent.node.children.push(it.node);
            Storage.set("trash", State.trash);
            saveFS();
            renderTrash(); render();
            Notifications.push("Lixeira", "Item restaurado.", "trash");
          });
          renderTrash();
        }
      });
    }

    function openFile(file) {
      const content = file.content || "";
      WindowManager.create({
        appId: "notepad-open", title: file.name, icon: "notepad", width: 600, height: 420, noPersist: true,
        onMount(body) {
          body.innerHTML = `<div class="np-layout"><textarea class="np-editor"></textarea><div class="np-statusbar"><span>${file.name}</span><span class="np-count"></span></div></div>`;
          const ta = body.querySelector(".np-editor");
          const count = body.querySelector(".np-count");
          ta.value = content;
          const update = () => count.textContent = `${ta.value.length} caracteres`;
          update();
          ta.addEventListener("input", update);
          const save = () => {
            const n = findNode(file.id);
            if (n) { n.node.content = ta.value; saveFS(); Notifications.push("Bloco de Notas", `Arquivo "${file.name}" salvo.`, "notepad"); }
          };
          ta.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
          const bar = document.createElement("div");
          bar.style.cssText = "position:absolute;top:6px;right:8px;z-index:5;display:flex;gap:6px;";
          bar.appendChild(el("button", { class: "app-btn primary", onclick: save }, "Salvar"));
          bar.appendChild(el("button", { class: "app-btn", onclick: () => downloadFile(file.name, ta.value) }, "Baixar"));
          body.appendChild(bar);
        }
      });
    }

    root.querySelector('[data-act="newfolder"]').addEventListener("click", () => {
      const name = prompt("Nome da nova pasta:", "Nova Pasta"); if (!name) return;
      const folder = findNode(currentId).node;
      folder.children.push({ id: uid(), name, type: "folder", children: [] });
      saveFS(); render();
    });
    root.querySelector('[data-act="newfile"]').addEventListener("click", () => {
      const name = prompt("Nome do novo arquivo:", "novo.txt"); if (!name) return;
      const folder = findNode(currentId).node;
      folder.children.push({ id: uid(), name, type: "file", content: "" });
      saveFS(); render();
    });
    root.querySelector('[data-act="rename"]').addEventListener("click", () => {
      if (!selectedId) return Notifications.push("Arquivos", "Selecione um item primeiro.", "files");
      const f = findNode(selectedId); if (!f) return;
      const name = prompt("Novo nome:", f.node.name); if (!name) return;
      f.node.name = name; saveFS(); render();
    });
    root.querySelector('[data-act="delete"]').addEventListener("click", () => {
      if (!selectedId) return Notifications.push("Arquivos", "Selecione um item primeiro.", "files");
      if (!confirm("Mover para a lixeira?")) return;
      const f = findNode(selectedId); if (!f || !f.parent) return;
      const item = f.parent.children.find(c => c.id === selectedId);
      State.trash.push({ node: JSON.parse(JSON.stringify(item)), parentId: f.parent.id });
      Storage.set("trash", State.trash);
      f.parent.children = f.parent.children.filter(c => c.id !== selectedId);
      selectedId = null; saveFS(); render();
      Notifications.push("Arquivos", "Item movido para a lixeira.", "trash");
    });
    root.querySelector('[data-act="props"]').addEventListener("click", () => {
      if (!selectedId) return Notifications.push("Arquivos", "Selecione um item primeiro.", "files");
      const f = findNode(selectedId).node;
      const size = f.type === "folder" ? `${f.children.length} item(ns)` : `${(f.content || "").length} caractere(s)`;
      alert(`Nome: ${f.name}\nTipo: ${f.type === "folder" ? "Pasta" : "Arquivo"}\nTamanho: ${size}`);
    });
    root.querySelector('[data-act="trash"]').addEventListener("click", openTrash);

    render();
  }
});

function downloadFile(name, content) {
  const blob = new Blob([content], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
  Notifications.push("Download", `"${name}" baixado.`, "download");
}

registerApp({
  id: "notepad", name: "Bloco de Notas", icon: "notepad", pinned: true,
  mount(root) {
    root.innerHTML = `
      <div class="np-layout">
        <div class="app-toolbar">
          <button class="app-btn" data-act="new">Novo</button>
          <button class="app-btn" data-act="open">Abrir</button>
          <button class="app-btn primary" data-act="save">Salvar</button>
          <button class="app-btn" data-act="export">Baixar</button>
          <label class="np-autosave" style="margin-left:auto;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px;">
            <input type="checkbox" id="np-autosave" style="accent-color:var(--accent);"> Autosave
          </label>
        </div>
        <textarea class="np-editor" spellcheck="false"></textarea>
        <div class="np-statusbar"><span id="np-file">Sem título</span><span id="np-count">0 caracteres</span></div>
      </div>
    `;
    const ta = root.querySelector(".np-editor");
    const status = root.querySelector("#np-file");
    const count = root.querySelector("#np-count");
    const autosaveCb = root.querySelector("#np-autosave");
    autosaveCb.checked = Storage.get("np_autosave", false);
    let currentFileId = null;
    let autosaveTimer = null;
    const updateCount = () => count.textContent = `${ta.value.length} caracteres`;
    ta.addEventListener("input", updateCount);

    function doSave(silent) {
      if (!currentFileId) {
        const name = prompt("Nome do arquivo:", "novo.txt"); if (!name) return;
        const folder = findNode("docs").node;
        const id = uid();
        folder.children.push({ id, name, type: "file", content: ta.value });
        currentFileId = id; status.textContent = name;
        saveFS();
      } else {
        const f = findNode(currentFileId);
        if (f) { f.node.content = ta.value; saveFS(); }
      }
      if (!silent) Notifications.push("Bloco de Notas", "Documento salvo.", "notepad");
    }

    autosaveCb.addEventListener("change", () => Storage.set("np_autosave", autosaveCb.checked));
    ta.addEventListener("input", () => {
      if (!autosaveCb.checked || !currentFileId) return;
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(() => doSave(true), 1500);
    });

    root.querySelector('[data-act="new"]').addEventListener("click", () => { ta.value = ""; currentFileId = null; status.textContent = "Sem título"; updateCount(); });
    root.querySelector('[data-act="save"]').addEventListener("click", () => doSave(false));
    root.querySelector('[data-act="export"]').addEventListener("click", () => downloadFile(status.textContent === "Sem título" ? "documento.txt" : status.textContent, ta.value));
    root.querySelector('[data-act="open"]').addEventListener("click", () => {
      const files = [];
      (function walk(n) { if (n.children) n.children.forEach(c => { if (c.type === "file") files.push(c); walk(c); }); })(State.fs);
      if (!files.length) return alert("Nenhum arquivo encontrado.");
      const names = files.map((f, i) => `${i+1}. ${f.name}`).join("\n");
      const pick = prompt("Escolha o número do arquivo:\n" + names);
      const idx = parseInt(pick) - 1;

registerApp({
  id: "calculator", name: "Calculadora", icon: "calculator", pinned: true,
  mount(root) {
    let sciMode = false;
    let expr = "", justEval = false;
    root.innerHTML = `
      <div class="calc-wrap" style="position:relative;">
        <div class="calc-top">
          <button class="calc-mode-toggle" id="calc-sci-toggle">Científica</button>
          <button class="calc-mode-toggle" id="calc-hist-toggle">Histórico</button>
        </div>
        <div class="calc-display">
          <div class="calc-expr"></div>
          <div class="calc-result">0</div>
        </div>
        <div id="calc-sci-row" class="calc-sci-row" style="display:none;">
          <button class="calc-sci-btn" data-sci="sin">sin</button>
          <button class="calc-sci-btn" data-sci="cos">cos</button>
          <button class="calc-sci-btn" data-sci="tan">tan</button>
          <button class="calc-sci-btn" data-sci="log">log</button>
          <button class="calc-sci-btn" data-sci="ln">ln</button>
          <button class="calc-sci-btn" data-sci="pi">π</button>
          <button class="calc-sci-btn" data-sci="e">e</button>
          <button class="calc-sci-btn" data-sci="pow">xʸ</button>
          <button class="calc-sci-btn" data-sci="sqrt">√</button>
          <button class="calc-sci-btn" data-sci="inv">1/x</button>
        </div>
        <div class="calc-grid" id="calc-grid">
          <button class="calc-btn fn" data-k="C">C</button>
          <button class="calc-btn fn" data-k="±">±</button>
          <button class="calc-btn fn" data-k="%">%</button>
          <button class="calc-btn op" data-k="/">÷</button>
          <button class="calc-btn" data-k="7">7</button><button class="calc-btn" data-k="8">8</button><button class="calc-btn" data-k="9">9</button>
          <button class="calc-btn op" data-k="*">×</button>
          <button class="calc-btn" data-k="4">4</button><button class="calc-btn" data-k="5">5</button><button class="calc-btn" data-k="6">6</button>
          <button class="calc-btn op" data-k="-">−</button>
          <button class="calc-btn" data-k="1">1</button><button class="calc-btn" data-k="2">2</button><button class="calc-btn" data-k="3">3</button>
          <button class="calc-btn op" data-k="+">+</button>
          <button class="calc-btn fn" data-k="√">√</button><button class="calc-btn" data-k="0">0</button><button class="calc-btn" data-k=".">.</button>
          <button class="calc-btn eq" data-k="=">=</button>
        </div>
        <div class="calc-history" id="calc-history">
          <div class="calc-hist-header"><h4>Histórico</h4><button class="app-btn" id="calc-hist-close">Fechar</button></div>
          <div class="calc-hist-list" id="calc-hist-list"></div>
        </div>
      </div>
    `;
    const exprEl = root.querySelector(".calc-expr");
    const resEl = root.querySelector(".calc-result");
    const histList = root.querySelector("#calc-hist-list");
    const histPane = root.querySelector("#calc-history");

    function setRes(v) { resEl.textContent = v; }
    function calc(expression) {
      let s = expression.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/%/g, "/100");
      s = s.replace(/π/g, "Math.PI").replace(/(?<![a-zA-Z])e(?![a-zA-Z])/g, "Math.E");
      s = s.replace(/√(\d+(\.\d+)?)/g, (m,n) => Math.sqrt(parseFloat(n)));
      // funções
      s = s.replace(/sin\(([^)]+)\)/g, (m,a) => Math.sin(parseFloat(a)));
      s = s.replace(/cos\(([^)]+)\)/g, (m,a) => Math.cos(parseFloat(a)));
      s = s.replace(/tan\(([^)]+)\)/g, (m,a) => Math.tan(parseFloat(a)));
      s = s.replace(/log\(([^)]+)\)/g, (m,a) => Math.log10(parseFloat(a)));
      s = s.replace(/ln\(([^)]+)\)/g, (m,a) => Math.log(parseFloat(a)));
      if (!/^[\d\s+\-*/().MathsincotaglPI E]+$/.test(s)) throw new Error("Inválido");
      // eslint-disable-next-line no-new-func
      let r = Function('"use strict";return (' + s + ')')();
      if (!isFinite(r)) throw new Error("Erro");
      return Math.round(r * 1e10) / 1e10;
    }
    function addHistory(e, r) {
      State.history.unshift({ expr: e, res: r });
      if (State.history.length > 30) State.history.pop();
      Storage.set("history", State.history);
      renderHistory();
    }
    function renderHistory() {
      histList.innerHTML = "";
      if (State.history.length === 0) { histList.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:12px;">Sem histórico</div>'; return; }
      State.history.forEach(h => {
        const item = el("div", { class: "calc-hist-item" }, [
          el("div", { class: "ch-expr" }, h.expr),
          el("div", { class: "ch-res" }, String(h.res))
        ]);
        item.addEventListener("click", () => { expr = String(h.res); exprEl.textContent = ""; setRes(h.res); histPane.classList.remove("open"); });
        histList.appendChild(item);
      });
    }
    function press(k) {
      if (k === "C") { expr = ""; exprEl.textContent = ""; setRes("0"); justEval = false; return; }
      if (k === "±") { if (expr.startsWith("-")) expr = expr.slice(1); else expr = "-" + expr; exprEl.textContent = expr; return; }
      if (k === "=") {
        try {
          const r = calc(expr); const oldExpr = expr;
          exprEl.textContent = oldExpr + " ="; setRes(r);
          addHistory(oldExpr, r);
          expr = String(r); justEval = true;
        } catch(e) { setRes("Erro"); }
        return;
      }
      if (k === "√") {
        try { const r = Math.sqrt(parseFloat(expr||"0")); exprEl.textContent = "√(" + expr + ") ="; setRes(r); expr = String(r); justEval = true; addHistory("√(" + expr + ")", r); }
        catch(e) { setRes("Erro"); } return;
      }
      if (justEval && /[\d.]/.test(k)) { expr = ""; exprEl.textContent = ""; }
      justEval = false;
      const map = { "/": "÷", "*": "×", "-": "−", "+": "+" };
      if (expr === "" && (k === "." || k === "0")) { expr = k === "." ? "0." : "0"; }
      else if (expr === "" && "+-*/".includes(k)) { expr = "0" + map[k]; }
      else if (expr !== "" && "+-*/".includes(expr.slice(-1)) && "+-*/".includes(k)) { expr = expr.slice(0, -1) + map[k]; }
      else { expr += map[k] || k; }
      exprEl.textContent = expr;
      try { setRes(calc(expr)); } catch(e) {}
    }
    function sciPress(k) {
      const cur = expr || "0";
      switch(k) {
        case "sin": expr += `sin(${cur})`; break;
        case "cos": expr += `cos(${cur})`; break;
        case "tan": expr += `tan(${cur})`; break;
        case "log": expr += `log(${cur})`; break;
        case "ln": expr += `ln(${cur})`; break;
        case "pi": expr += "π"; break;
        case "e": expr += "e"; break;
        case "pow": expr += "^"; break; // placeholder
        case "sqrt": press("√"); return;
        case "inv": expr = `1/(${cur})`; break;
      }
      exprEl.textContent = expr;
      try { setRes(calc(expr)); } catch(e) {}
    }
    root.querySelectorAll(".calc-btn").forEach(b => b.addEventListener("click", () => press(b.dataset.k)));
    root.querySelectorAll(".calc-sci-btn").forEach(b => b.addEventListener("click", () => sciPress(b.dataset.sci)));
    root.querySelector("#calc-sci-toggle").addEventListener("click", (e) => {
      sciMode = !sciMode;
      root.querySelector("#calc-sci-row").style.display = sciMode ? "grid" : "none";
      e.target.classList.toggle("active", sciMode);
    });
    root.querySelector("#calc-hist-toggle").addEventListener("click", () => { histPane.classList.add("open"); renderHistory(); });
    root.querySelector("#calc-hist-close").addEventListener("click", () => histPane.classList.remove("open"));
    root.addEventListener("keydown", (e) => {
      const k = e.key;
      if (/^\d$/.test(k) || "+-*/.".includes(k)) { press(k); e.preventDefault(); }
      else if (k === "Enter") { press("="); e.preventDefault(); }
      else if (k === "Escape") { press("C"); e.preventDefault(); }
    });
    root.tabIndex = 0;
    setTimeout(() => root.focus(), 50);
    renderHistory();
  }
});

registerApp({
  id: "gallery", name: "Galeria", icon: "gallery", pinned: false,
  mount(root) {
    root.innerHTML = `
      <div style="height:100%;display:flex;flex-direction:column;">
        <div class="app-toolbar">
          <button class="app-btn primary" data-act="upload">Adicionar imagem</button>
